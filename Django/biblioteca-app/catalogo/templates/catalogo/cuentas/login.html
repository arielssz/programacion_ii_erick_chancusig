<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><title>Login</title></head><body>
<h1>Control de Acceso</h1><h2>Sistema de Gestión Bibliotecaria</h2>
{% if form.errors %}<p>Usuario o contraseña incorrectos.</p>{% endif %}
<form method="post">{% csrf_token %}
<p><label for="id_username">Nombre de usuario:</label> {{ form.username }}</p>
<p><label for="id_password">Contraseña:</label> {{ form.password }}</p>
<input type="hidden" name="next" value="{{ next }}">
<button type="submit">Iniciar Sesión</button></form>
</body></html>
